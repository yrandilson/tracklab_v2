<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — TrackLab</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Clash+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f4f7fb; --s1:#ffffff; --s2:#edf3f9;
  --b1:#d5deea; --t1:#102033; --t2:#475569; --t3:#6b7280;
  --c1:#0f766e; --c2:#2563eb; --c3:#e11d48;
  --mono:'JetBrains Mono',monospace; --display:'Clash Display','Syne',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body {
  background:var(--bg); color:var(--t1); font-family:var(--mono);
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  position:relative; overflow:hidden;
}
body::before {
  content:''; position:fixed; inset:0;
  background:
    radial-gradient(circle at 25% 35%, rgba(15,118,110,0.12) 0%, transparent 50%),
    radial-gradient(circle at 75% 65%, rgba(37,99,235,0.10) 0%, transparent 50%),
    radial-gradient(circle at 50% 85%, rgba(124,58,237,0.08) 0%, transparent 40%);
  pointer-events:none;
}
body::after {
  content:''; position:fixed; inset:0;
  background-image:
    linear-gradient(rgba(16,32,51,0.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(16,32,51,0.03) 1px,transparent 1px);
  background-size:28px 28px; pointer-events:none;
}
.login-box {
  width:100%; max-width:380px;
  background:rgba(255,255,255,0.92); border:1px solid rgba(213,222,234,0.9);
  border-radius:18px; padding:40px;
  position:relative; z-index:1;
  box-shadow:0 28px 80px rgba(16,32,51,0.10);
  backdrop-filter: blur(18px);
  animation:appear 0.4s ease;
}
@keyframes appear { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
.login-logo {
  display:flex; align-items:center; gap:12px; justify-content:center;
  margin-bottom:32px;
}
.logo-icon {
  width:44px; height:44px; background:linear-gradient(135deg, var(--c1), var(--c2)); border-radius:12px;
  display:flex; align-items:center; justify-content:center; font-size:1.3rem;
  color:#fff;
}
.logo-text { font-family:var(--display); font-size:1.5rem; font-weight:700; }
.logo-text span { color:var(--c2); }
.field { margin-bottom:16px; }
label { font-size:0.68rem; text-transform:uppercase; letter-spacing:0.12em; color:var(--t3); display:block; margin-bottom:6px; }
input {
  width:100%; background:#fff; border:1px solid var(--b1);
  color:var(--t1); padding:11px 14px; border-radius:8px;
  font-family:var(--mono); font-size:0.85rem; outline:none;
  transition:border-color 0.2s;
}
input:focus { border-color:var(--c1); }
input::placeholder { color:var(--t3); }
button {
  width:100%; background:linear-gradient(135deg, var(--c1), var(--c2)); color:#fff;
  border:none; padding:12px; border-radius:8px;
  font-family:var(--mono); font-size:0.85rem; font-weight:700;
  cursor:pointer; margin-top:8px; transition:all 0.15s;
}
button:hover { transform:translateY(-1px); box-shadow:0 10px 24px rgba(37,99,235,0.18); }
button:disabled { opacity:0.5; cursor:not-allowed; }
.error-msg { color:var(--c3); font-size:0.75rem; text-align:center; margin-top:12px; display:none; }
.divider { font-size:0.65rem; text-align:center; color:var(--t3); margin:20px 0 16px; }
.demo-hint {
  background:rgba(37,99,235,0.05); border:1px solid rgba(37,99,235,0.12);
  border-radius:8px; padding:12px; font-size:0.72rem; color:var(--t3); line-height:1.6;
}
.demo-hint strong { color:var(--c2); }
</style>
</head>
<body>
<div class="login-box">
  <div class="login-logo">
    <div class="logo-icon">⬡</div>
    <div class="logo-text">Track<span>Lab</span></div>
  </div>

  <div class="field">
    <label>Usuário</label>
    <input type="text" id="username" placeholder="admin" autocomplete="username">
  </div>
  <div class="field">
    <label>Senha</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter') doLogin()">
  </div>
  <button id="loginBtn" onclick="doLogin()">Entrar no Dashboard →</button>
  <div class="error-msg" id="errMsg"></div>

  <div class="divider">— Demonstração —</div>
  <div class="demo-hint">
    <strong>admin</strong> / <strong>admin123</strong><br>
    Acesso padrão para fins educacionais
  </div>
</div>

<script>
async function doLogin() {
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('errMsg');
  btn.disabled = true; btn.textContent = 'Verificando...';
  err.style.display = 'none';
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      })
    });
    const d = await r.json();
    if (d.ok) {
      btn.textContent = '✅ Redirecionando...';
      window.location.href = '/dashboard';
    } else {
      err.textContent = '❌ ' + (d.error || 'Credenciais inválidas');
      err.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Entrar no Dashboard →';
    }
  } catch(e) {
    err.textContent = '❌ Servidor offline: ' + e.message;
    err.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Entrar no Dashboard →';
  }
}
</script>
</body>
</html>
